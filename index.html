<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtre Kuzco</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div>Chargement du filtre Kuzco...</div>
    <div style="font-size:0.8rem;color:#888">MediaPipe Face Mesh (468 points)</div>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="c" width="1280" height="720"></canvas>

  <div id="controls">
    <button class="active" data-f="llama">Lama</button>
    <button data-f="kuzco">Kuzco</button>
    <button data-f="none">✕ Off</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>

</body>
</html>
